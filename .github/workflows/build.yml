name: Build Apps

on:
  push:
    branches: [ main ]
  pull_request:
  # Publishing a GitHub Release tests and builds the release's tag and attaches
  # both installers to the release.
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Re-attach installers to this existing release (e.g. v3.2.0). Leave empty for a plain build.'
        required: false
        default: ''

env:
  # Non-empty only when the installers should be attached to a release.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # npm ci installs exactly what package-lock.json pins (including the
    # aliased, integrity-checked SheetJS) and fails if the lockfile is stale.
    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    # The stylesheet is generated from the classes used in the source, and is
    # committed. Nothing enforced that until now, so it silently went stale.
    - name: Stylesheet is up to date
      run: |
        npm run build-css
        git diff --exit-code vendor/tailwind.css

    - name: Unit tests
      run: npm test

    # The smoke test drives the real Electron window, so it needs a display.
    - name: Smoke test
      run: xvfb-run -a --server-args="-screen 0 1600x1000x24" npm run test:smoke

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    # npm ci installs exactly what package-lock.json pins (including the
    # aliased, integrity-checked SheetJS) and fails if the lockfile is stale.
    - name: Install dependencies
      run: npm ci
    
    - name: Build Windows app
      run: npm run build
    
    - name: Upload Windows installer
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: dist/*.exe

    # Release runs only. GitHub turns the spaces in the file name into dots:
    # Forest.Plot.Generator.Setup.<version>.exe. bash, so the glob expands.
    - name: Attach installer to the release
      if: env.RELEASE_TAG != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$RELEASE_TAG" dist/*Setup*.exe --clobber --repo "$GITHUB_REPOSITORY"

  build-macos:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    # npm ci installs exactly what package-lock.json pins (including the
    # aliased, integrity-checked SheetJS) and fails if the lockfile is stale.
    - name: Install dependencies
      run: npm ci
    
    - name: Build macOS app
      run: npm run build-mac
    
    - name: Upload macOS installer
      uses: actions/upload-artifact@v4
      with:
        name: macos-installer
        path: dist/*.dmg

    # Release runs only: Forest.Plot.Generator-<version>-arm64.dmg.
    - name: Attach installer to the release
      if: env.RELEASE_TAG != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$RELEASE_TAG" dist/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
