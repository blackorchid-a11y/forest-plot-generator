name: Build Apps

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # npm ci installs exactly what package-lock.json pins (including the
    # aliased, integrity-checked SheetJS) and fails if the lockfile is stale.
    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    # The stylesheet is generated from the classes used in the source, and is
    # committed. Nothing enforced that until now, so it silently went stale.
    - name: Stylesheet is up to date
      run: |
        npm run build-css
        git diff --exit-code vendor/tailwind.css

    - name: Unit tests
      run: npm test

    # The smoke test drives the real Electron window, so it needs a display.
    - name: Smoke test
      run: xvfb-run -a --server-args="-screen 0 1600x1000x24" npm run test:smoke

  build-windows:
    needs: test
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    # npm ci installs exactly what package-lock.json pins (including the
    # aliased, integrity-checked SheetJS) and fails if the lockfile is stale.
    - name: Install dependencies
      run: npm ci
    
    - name: Build Windows app
      run: npm run build
    
    - name: Upload Windows installer
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: dist/*.exe

  build-macos:
    needs: test
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    # npm ci installs exactly what package-lock.json pins (including the
    # aliased, integrity-checked SheetJS) and fails if the lockfile is stale.
    - name: Install dependencies
      run: npm ci
    
    - name: Build macOS app
      run: npm run build-mac
    
    - name: Upload macOS installer
      uses: actions/upload-artifact@v4
      with:
        name: macos-installer
        path: dist/*.dmg